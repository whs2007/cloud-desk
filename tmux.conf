# 终端会话（tmux）配置
# 由 server.py 在启动 tmux 时用 -f 指定，只影响本项目托管的会话。
set -g status off              # 手机屏幕小，不要底部状态栏
set -g history-limit 50000     # 回滚缓冲，够翻很久的命令输出
set -g default-terminal "screen-256color"
set -g escape-time 0           # 降低按键延迟
setw -g aggressive-resize on
set -g visual-activity off
set -g visual-bell off
