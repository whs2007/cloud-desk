name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt

      - name: 语法检查
        run: python -m compileall -q server.py store.py platform_chat.py say.py

      - name: 启动冒烟
        run: |
          mkdir -p .ci-ws
          DESK_PASSWORD=ci-only PORT=8080 WORKSPACE_ROOT="$PWD/.ci-ws" \
            python3 server.py > server.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8080/ > /dev/null && break
            sleep 1
          done
          curl -sf http://127.0.0.1:8080/ | grep -q "云桌面" || { echo "页面没起来"; cat server.log; exit 1; }
          curl -sf http://127.0.0.1:8080/api/check | grep -q '"ok"' || { echo "/api/check 异常"; cat server.log; exit 1; }
          echo "smoke ok"
