services:
  desk:
    build:
      context: .
      args:
        # 想用「截图浏览器」把这里改成 "1"（首次构建会多花几分钟装 Chromium）
        WITH_BROWSER: "0"
    ports:
      - "8080:8080"
    environment:
      # 访问密码。故意不写默认值：${VAR:?} 表示未设置时直接启动失败并提示，
      # 避免把 "change-me" 这类示例口令带进真实部署（它曾出现在公开仓库里）。
      # 用法：DESK_PASSWORD=你的密码 docker compose up -d
      DESK_PASSWORD: "${DESK_PASSWORD:?请在 .env 或环境变量中设置 DESK_PASSWORD}"
      WORKSPACE_ROOT: "/workspace"
    volumes:
      # 左边是你宿主机上的项目目录，右边固定为容器工作区
      - ./workspace:/workspace
    restart: unless-stopped
    # PTY 终端需要，避免信号/进程组异常
    tty: true
    stdin_open: true
